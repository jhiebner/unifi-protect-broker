version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pb-postgres
    environment:
      POSTGRES_DB: protect_broker
      POSTGRES_USER: broker_user
      POSTGRES_PASSWORD: dev_password_change_in_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker_user -d protect_broker"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pb_network

  # Backend API (.NET 9)
  api:
    build:
      context: ./src/ProtectBroker.Api
      dockerfile: Dockerfile
    container_name: pb-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_HTTP_PORT: 5000
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=protect_broker;Username=broker_user;Password=dev_password_change_in_production"
      Jwt__Key: "your-secret-key-change-in-production-min-32-chars-long"
      Jwt__Issuer: "ProtectBroker"
      Jwt__Audience: "ProtectBroker"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/ProtectBroker.Api:/app
    networks:
      - pb_network

  # Frontend React (Vite)
  web:
    build:
      context: ./src/ProtectBroker.Web
      dockerfile: Dockerfile
    container_name: pb-web
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_WS_URL: ws://localhost:5000
    ports:
      - "5173:5173"
    volumes:
      - ./src/ProtectBroker.Web:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - pb_network

volumes:
  postgres_data:

networks:
  pb_network:
    driver: bridge
